  - _id: CCwqekLQvFbTu1Fk
    name: Les compétences
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-page-cof-base">
          <h2>Les compétences</h2>
          <p class="lettrine">
            Le système de compétences de l'Atlas d'Osgild (p.223-227) remplace la lecture « large » des voies par une liste concrète de 22 compétences. Chaque compétence est liée à une
            caractéristique, parfois à plusieurs, et possède un bonus qui progresse avec les points de compétence. Toutes les compétences sont à +0 tant qu'aucun point n'y a été investi.
          </p>

          <h3>Le test de compétence</h3>
          <p class="alinea">Un test de compétence se résout comme un test de caractéristique, auquel s'ajoute le bonus de la compétence :</p>
          <p class="exemple"><span class="gras">Test de compétence = 1d20 + bonus de compétence + caractéristique</span>, comparé à la difficulté.</p>
          <p class="alinea">
            Le jet passe par la fenêtre de jet habituelle du système : dé bonus ou dé malus (caractéristique supérieure, état affaibli…), seuil de critique, difficulté et points de
            chance fonctionnent comme pour un test de caractéristique. Voir @UUID[Compendium.cof2-options.guide.JournalEntry.cwOU2QizqgCmB57H.JournalEntryPage.aJ0nQq1LyiPCMM4m]{Sur la fiche de personnage} pour le détail.
          </p>

          <h3>Liste des compétences</h3>
          <table class="tableau">
            <tbody>
              <tr class="tableau-titre">
                <td colspan="2">Les 22 compétences</td>
              </tr>
              <tr class="tableau-entete">
                <td>Compétence</td>
                <td>Caractéristique(s)</td>
              </tr>
              <tr><td>Acrobaties</td><td>AGI</td></tr>
              <tr><td>Artisanat</td><td>INT</td></tr>
              <tr><td>Athlétisme</td><td>AGI, FOR ou CON</td></tr>
              <tr><td>Commerce</td><td>CHA</td></tr>
              <tr><td>Connaissances</td><td>INT</td></tr>
              <tr><td>Discrétion</td><td>AGI</td></tr>
              <tr><td>Divertissement</td><td>CHA</td></tr>
              <tr><td>Effraction</td><td>AGI</td></tr>
              <tr><td>Empathie</td><td>PER</td></tr>
              <tr><td>Équitation</td><td>AGI ou CHA</td></tr>
              <tr><td>Escalade</td><td>AGI</td></tr>
              <tr><td>Intimidation</td><td>CHA</td></tr>
              <tr><td>Médecine</td><td>PER</td></tr>
              <tr><td>Natation</td><td>CON</td></tr>
              <tr><td>Occultisme</td><td>INT</td></tr>
              <tr><td>Persuasion</td><td>CHA</td></tr>
              <tr><td>Religion</td><td>INT</td></tr>
              <tr><td>Renseignement</td><td>CHA</td></tr>
              <tr><td>Sciences</td><td>INT</td></tr>
              <tr><td>Survie</td><td>PER</td></tr>
              <tr><td>Tromperie</td><td>CHA</td></tr>
              <tr><td>Vigilance</td><td>PER</td></tr>
            </tbody>
          </table>
          <p class="alinea">
            Quand une compétence est liée à plusieurs caractéristiques, c'est le joueur qui choisit celle du test, selon l'action entreprise : courir et sauter (AGI ou FOR), soulever un
            objet lourd (FOR) ou marcher longtemps (CON) pour l'Athlétisme ; monter à cheval (AGI) ou calmer une monture (CHA) pour l'Équitation. La description complète de chaque
            compétence se trouve dans l'Atlas d'Osgild (p.223-224).
          </p>

          <h3>Compétences et armure</h3>
          <p class="alinea">
            Le malus d'armure s'applique automatiquement à <span class="gras">tous les tests de compétence basés sur l'AGI ou la CON</span>. Il est reporté dans le champ Malus de la
            fenêtre de jet.
          </p>
          <p class="exemple">
            Un personnage en armure qui tente un test d'Athlétisme choisit entre un test de FOR sans malus d'armure et un test d'AGI avec ce malus.
          </p>

          <h3>Valeur maximale</h3>
          <p class="alinea">
            Le bonus d'une compétence ne peut pas dépasser <span class="gras">niveau du personnage + 5</span>, et jamais plus de <span class="gras">+15</span>. Le bouton d'augmentation
            de l'onglet Compétences se désactive une fois ce plafond atteint.
          </p>
        </div>
