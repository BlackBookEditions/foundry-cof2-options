    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-page-cof-base">
          <h2>Limites et écarts</h2>
          <p class="lettrine">
            Le module automatise le cœur du système de compétences de l'Atlas d'Osgild. Quelques règles secondaires du même chapitre ne sont pas implémentées, et quelques points
            s'écartent du livre. Le MJ peut les appliquer à la main.
          </p>

          <h3>Règles non implémentées</h3>
          <h4>Capacités et compétences</h4>
          <p class="alinea">
            Le livre permet de renoncer au bonus d'une capacité (bonus égal à rang + 2 sur un test de caractéristique) pour gagner 4 points de compétence, ou 5 pour une capacité de voie
            de prestige. Le module ne propose pas cet échange : les capacités gardent leur bonus, qui reste réservé aux tests de caractéristique.
          </p>
          <h4>Progression par PEX</h4>
          <p class="alinea">
            La variante qui associe les compétences à la progression par PEX (« Cumul des systèmes PEX et compétences ») n'est pas implémentée, y compris son nombre de compétences
            hybrides variable selon le profil (de 1 à 3). Le module applique la règle de base : 2 compétences par voie hybride.
          </p>
          <h4>Note du gnome</h4>
          <p class="alinea">
            « Au rang 2 de la voie du gnome, le bonus de +3 s'applique également à la compétence persuasion » : cette note n'est pas reprise.
          </p>

          <h3>Écarts avec le livre</h3>
          <ul>
            <li class="puce-noire">
              <p>
                <span class="gras">Points non dépensés</span> : ils sont conservés d'un niveau sur l'autre et peuvent être redistribués à tout moment avec
                <i class="fa-solid fa-minus"></i>, alors que le livre impose de les dépenser immédiatement.
              </p>
            </li>
            <li class="puce-noire">
              <p>
                <span class="gras">Doublement du bonus</span> : il n'est appliqué que pour une maîtrise obtenue par une voie hybride. Il ne l'est pas quand la maîtrise vient de la voie de
                peuple, si des points ont été investis dans la compétence avant d'apprendre la capacité de rang 1. Le bonus doublé n'est pas ramené au plafond niveau + 5.
              </p>
            </li>
            <li class="puce-noire">
              <p>
                <span class="gras">Retrait d'une voie</span> : les points investis dans une compétence qui n'est plus maîtrisée ne sont pas remboursés.
              </p>
            </li>
          </ul>

          <h3>Hors du périmètre</h3>
          <ul>
            <li class="puce-noire"><p>La mini-fiche de personnage n'affiche pas les compétences.</p></li>
            <li class="puce-noire"><p>Les Rencontres (PNJ et créatures) n'ont pas de compétences.</p></li>
            <li class="puce-noire">
              <p>
                Les profils et voies de peuple créés à la main, dont l'identifiant ne correspond pas à ceux du Livre des règles (<span class="italique">cof2-base</span>), n'accordent
                aucune maîtrise.
              </p>
            </li>
          </ul>
        </div>
