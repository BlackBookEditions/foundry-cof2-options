  - _id: Lsf0qafANNj8ONRu
    name: La maîtrise
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-page-cof-base">
          <h2>La maîtrise</h2>
          <p class="lettrine">
            Un personnage <span class="gras">maîtrise</span> certaines compétences, selon son profil, ses voies et son peuple. La maîtrise rend une compétence moins chère à développer :
            augmenter son bonus de +1 coûte <span class="gras">1 point de compétence</span> si elle est maîtrisée, et <span class="gras">2 points</span> sinon. Le module calcule la
            maîtrise automatiquement ; sur la fiche, une compétence maîtrisée apparaît en gras, suivie de l'icône <i class="fa-solid fa-shield-halved"></i>.
          </p>

          <h3>Profil principal</h3>
          <p class="alinea">Un personnage maîtrise toutes les compétences de son profil principal (Atlas d'Osgild p.224-225).</p>
          <table class="tableau">
            <tbody>
              <tr class="tableau-titre">
                <td colspan="2">Compétences maîtrisées par profil</td>
              </tr>
              <tr class="tableau-entete">
                <td>Profil</td>
                <td>Compétences</td>
              </tr>
              <tr><td>Barbare</td><td>artisanat, athlétisme, équitation, escalade, intimidation, natation, survie, vigilance</td></tr>
              <tr><td>Chevalier</td><td>athlétisme, connaissances, équitation, intimidation, natation, persuasion, religion</td></tr>
              <tr><td>Guerrier</td><td>artisanat, athlétisme, équitation, intimidation, natation</td></tr>
              <tr><td>Arquebusier</td><td>artisanat, athlétisme, équitation, intimidation, natation, sciences, vigilance</td></tr>
              <tr>
                <td>Barde</td>
                <td>
                  acrobaties, artisanat, athlétisme, commerce, connaissances, divertissement, empathie, équitation, intimidation, natation, persuasion, religion, renseignement,
                  tromperie
                </td>
              </tr>
              <tr>
                <td>Voleur</td>
                <td>acrobaties, artisanat, athlétisme, commerce, discrétion, escalade, effraction, intimidation, natation, persuasion, renseignement, tromperie, vigilance</td>
              </tr>
              <tr><td>Rôdeur</td><td>acrobaties, artisanat, athlétisme, discrétion, équitation, escalade, médecine, natation, survie, vigilance</td></tr>
              <tr><td>Ensorceleur, Forgesort, Magicien, Sorcier</td><td>artisanat, connaissances, occultisme, sciences</td></tr>
              <tr>
                <td>Druide</td>
                <td>artisanat, athlétisme, connaissances, discrétion, équitation, empathie, médecine, natation, religion, survie, vigilance</td>
              </tr>
              <tr>
                <td>Moine</td>
                <td>acrobaties, artisanat, athlétisme, connaissances, discrétion, empathie, escalade, médecine, natation, religion, survie, vigilance</td>
              </tr>
              <tr>
                <td>Prêtre</td>
                <td>artisanat, athlétisme, connaissances, empathie, équitation, intimidation, médecine, persuasion, religion, survie</td>
              </tr>
            </tbody>
          </table>

          <h3>Profil hybride</h3>
          <p class="alinea">
            Chaque fois qu'un personnage ouvre une <span class="gras">voie issue d'un autre profil</span> que son profil principal, une fenêtre lui demande de choisir
            <span class="gras">2 compétences</span> de ce profil, parmi celles qu'il ne maîtrise pas encore. S'il n'en reste qu'une, il n'en choisit qu'une ; s'il les maîtrise déjà
            toutes, aucune fenêtre ne s'ouvre.
          </p>
          <p class="exemple">
            Lhagva la barbare ouvre la voie du chevalier. Elle maîtrise déjà athlétisme, équitation, intimidation et natation : la fenêtre lui propose connaissances, persuasion et
            religion, parmi lesquelles elle en choisit deux.
          </p>
          <p class="alinea">
            Si le personnage avait déjà investi des points dans une compétence qu'il vient de maîtriser, <span class="gras">son bonus est doublé</span> (Atlas d'Osgild p.225).
          </p>
          <p class="exemple">Au niveau 6, Lhagva a +2 en acrobaties (4 points investis) quand elle ouvre une voie de voleur et choisit acrobaties : son bonus passe à +4.</p>
          <p class="alinea">
            Les quatre profils de mage partagent la même liste : un magicien qui ouvre une voie d'ensorceleur maîtrise déjà ces compétences et ne choisit rien. Si la fenêtre est fermée
            sans valider, la voie n'accorde aucune maîtrise.
          </p>

          <h3>Compétences de peuple</h3>
          <p class="alinea">
            Au lieu de son bonus habituel de +3, la <span class="gras">capacité de rang 1 de la voie de peuple</span> donne la maîtrise de deux compétences, sans point de bonus (Atlas
            d'Osgild p.225). La maîtrise est accordée dès que cette capacité est apprise.
          </p>
          <table class="tableau">
            <tbody>
              <tr class="tableau-titre">
                <td colspan="3">Compétences de peuple</td>
              </tr>
              <tr class="tableau-entete">
                <td>Voie de peuple</td>
                <td>Capacité de rang 1</td>
                <td>Compétences maîtrisées</td>
              </tr>
              <tr><td>Voie du demi-orc</td><td>Impressionnant</td><td>athlétisme, intimidation</td></tr>
              <tr><td>Voie de l'elfe haut</td><td>Lumière intérieure</td><td>connaissances, divertissement</td></tr>
              <tr><td>Voie de l'elfe sylvain</td><td>Lumière des étoiles</td><td>discrétion, survie</td></tr>
              <tr><td>Voie du gnome</td><td>Don étrange</td><td>sciences, occultisme</td></tr>
              <tr><td>Voie de l'halfelin</td><td>Petite taille</td><td>discrétion, effraction</td></tr>
              <tr><td>Voie de l'humain</td><td>Diversité</td><td>artisanat et une compétence au choix</td></tr>
              <tr><td>Voie du nain</td><td>Habitant des tunnels</td><td>artisanat, vigilance</td></tr>
            </tbody>
          </table>
          <ul>
            <li class="puce-noire">
              <p>
                <span class="gras">Humain</span> : une fenêtre propose de choisir la seconde compétence parmi toutes les autres. Si elle est fermée sans valider, elle sera proposée de
                nouveau à la prochaine modification de la voie.
              </p>
            </li>
            <li class="puce-noire">
              <p>
                <span class="gras">Demi-elfe</span> : le livre ne le cite pas. Le demi-elfe suivant la voie de peuple de l'un de ses parents, il reçoit les compétences de cette voie
                (elfe haut, elfe sylvain ou humain).
              </p>
            </li>
            <li class="puce-noire">
              <p>
                <span class="gras">Voie du mage</span> : elle n'accorde pas de compétences de peuple. Le mage qui l'a choisie conserve la capacité de rang 1 de sa voie de peuple, et donc
                la maîtrise qui va avec.
              </p>
            </li>
          </ul>

          <h4>Double maîtrise</h4>
          <p class="alinea">
            Si une compétence de peuple est déjà maîtrisée grâce au profil (principal ou hybride), le personnage reçoit à la place
            <span class="gras">2 points de compétence supplémentaires investis dans cette compétence</span>, soit +2. Ces +2 ne sont pas pris sur les points de compétence du niveau et
            ne peuvent pas être retirés avec le bouton <i class="fa-solid fa-minus"></i>.
          </p>
          <p class="exemple">
            Au niveau 1, Lhagva la barbare humaine choisit athlétisme comme compétence de peuple, qu'elle maîtrise déjà et dans laquelle elle a investi 1 point : elle passe à +3. Elle
            obtient aussi +2 en artisanat, déjà maîtrisé par son profil.
          </p>

          <h4>Le bonus de +3 disparaît</h4>
          <p class="alinea">
            Quand le système de compétences est actif, les bonus de +3 aux tests de caractéristique accordés par la capacité de rang 1 de ces voies (par exemple +3 en INT et en CHA pour
            Lumière intérieure) <span class="gras">ne sont plus proposés dans la fenêtre de jet</span>, ni pour les tests de caractéristique ni pour les tests de compétence. Les autres
            effets de ces capacités sont conservés : vision dans le noir, bonus de DEF de l'halfelin…
          </p>

          <h3>Retrait d'une voie</h3>
          <p class="alinea">
            Si une voie hors profil ou la voie de peuple est retirée de la fiche, la maîtrise qu'elle accordait disparaît. Les bonus déjà investis sont conservés tels quels ; seul le
            coût des prochains points repasse à 2.
          </p>
        </div>
