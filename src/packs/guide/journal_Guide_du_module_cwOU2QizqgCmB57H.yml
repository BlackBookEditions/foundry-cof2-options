_id: cwOU2QizqgCmB57H
name: Guide du module Options
pages:
  - _id: aQaMFrNXW471Niy9
    name: Introduction
    type: text
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-page-cof-base">
          <h2>Introduction</h2>
          <h3>Chroniques Oubliées Fantasy 2e édition : Options</h3>
          <p class="lettrine">
            Ce module ajoute au système <span class="gras">Chroniques Oubliées 2</span> des règles issues de l'<span class="gras">Atlas d'Osgild</span> et des règles optionnelles,
            <span class="gras">sans modifier le système</span>. Chaque règle s'active séparément depuis les paramètres du monde : tant qu'elle n'est pas activée, le jeu se déroule
            exactement comme avec le système seul.
          </p>
          <p class="alinea">Le module propose aujourd'hui une règle optionnelle :</p>
          <ul>
            <li class="puce-noire">
              <p>
                le <span class="gras">système de compétences</span> de l'Atlas d'Osgild (chapitre « Systèmes alternatifs »), qui ajoute aux tests de caractéristique 22 compétences
                nommées, avec maîtrise, points de compétence et plafond de valeur.
              </p>
            </li>
          </ul>

          <h3>Prérequis</h3>
          <ul>
            <li class="puce-noire"><p>Foundry VTT version 14.</p></li>
            <li class="puce-noire"><p>Le système Chroniques Oubliées 2 (<span class="italique">co2</span>).</p></li>
            <li class="puce-noire">
              <p>
                Le module <span class="gras">Chroniques Oubliées Fantasy Livre des règles</span> (<span class="italique">cof2-base</span>) est fortement recommandé : la maîtrise des
                compétences reconnaît les profils et les voies de peuple de ses compendiums. Un profil ou une voie de peuple créé à la main n'accorde aucune maîtrise.
              </p>
            </li>
          </ul>

          <h3>Activation du système de compétences</h3>
          <p class="alinea">
            Le MJ ouvre <span class="gras">Paramètres du jeu &gt; Configurer les paramètres</span>, onglet du module <span class="italique">Chroniques Oubliées Fantasy 2e édition :
            Options</span>, et coche <span class="gras">« Système de compétences (Atlas d'Osgild) »</span>. Le monde doit être rechargé pour que le réglage prenne effet.
          </p>
          <p class="alinea">Une fois la règle active :</p>
          <ul>
            <li class="puce-noire"><p>un onglet <span class="gras">Compétences</span> apparaît sur la fiche de chaque Personnage ;</p></li>
            <li class="puce-noire"><p>les tests de caractéristique restent disponibles comme d'habitude ;</p></li>
            <li class="puce-noire">
              <p>le bonus de +3 de la capacité de rang 1 des voies de peuple est remplacé par la maîtrise de deux compétences de peuple.</p>
            </li>
          </ul>
          <p class="exemple">
            La règle ne concerne que les Personnages. Les Rencontres (PNJ et créatures) gardent leurs tests de caractéristique habituels.
          </p>

          <h3>Contenu de ce guide</h3>
          <ul>
            <li class="puce-noire"><p>@UUID[Compendium.cof2-options.guide.JournalEntry.cwOU2QizqgCmB57H.JournalEntryPage.CCwqekLQvFbTu1Fk]{Les compétences} : la liste des compétences, le test et le malus d'armure.</p></li>
            <li class="puce-noire"><p>@UUID[Compendium.cof2-options.guide.JournalEntry.cwOU2QizqgCmB57H.JournalEntryPage.Lsf0qafANNj8ONRu]{La maîtrise} : profil principal, profil hybride, compétences de peuple.</p></li>
            <li class="puce-noire"><p>@UUID[Compendium.cof2-options.guide.JournalEntry.cwOU2QizqgCmB57H.JournalEntryPage.aJ0nQq1LyiPCMM4m]{Sur la fiche de personnage} : l'onglet Compétences, les points de compétence et les jets.</p></li>
            <li class="puce-noire"><p>@UUID[Compendium.cof2-options.guide.JournalEntry.cwOU2QizqgCmB57H.JournalEntryPage.HaqlOwpAEmpo3tX8]{Limites et écarts} : ce que le module ne gère pas, et les écarts avec le livre.</p></li>
          </ul>
        </div>
